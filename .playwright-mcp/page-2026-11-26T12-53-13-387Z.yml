    - region "Dividir gastos en grupo, en tres pasos" [ref=f3e81]:
      - generic [ref=f3e82]:
        - generic [ref=f3e83]:
          - generic [ref=f3e84]: Cómo funciona
          - heading "Dividir gastos en grupo, en tres pasos" [level=2] [ref=f3e85]
          - paragraph [ref=f3e86]: Pensado para que nadie tenga que abrir una hoja de cálculo ni perseguir a nadie por Bizum.
        - list [ref=f3e87]:
          - listitem [ref=f3e88]:
            - heading "Crea el grupo e invita" [level=3] [ref=f3e89]
            - paragraph [ref=f3e90]: Ponle nombre (“Piso Gràcia”, “Roadtrip Islandia”), elige la moneda y comparte el enlace de invitación. Cada persona se une con su cuenta.
          - listitem [ref=f3e91]:
            - heading "Añade gastos al momento" [level=3] [ref=f3e92]
            - paragraph [ref=f3e93]: "Indica quién pagó y entre quién se reparte: a partes iguales, por importes, porcentajes o partes. Adjunta la foto del ticket si quieres."
          - listitem [ref=f3e94]:
            - heading "Salda con los mínimos pagos" [level=3] [ref=f3e95]
            - paragraph [ref=f3e96]: Juntio calcula los saldos y sugiere quién paga a quién para quedar a mano con el menor número de transferencias. Registra cada pago y listo.
    - region "Todo lo que necesitas para llevar las cuentas claras" [ref=f3e97]:
      - generic [ref=f3e98]:
        - generic [ref=f3e99]:
          - generic [ref=f3e100]: Funciones
          - heading "Todo lo que necesitas para llevar las cuentas claras" [level=2] [ref=f3e101]
          - paragraph [ref=f3e102]: Una sola app, la misma experiencia en el navegador, el móvil y el ordenador.
        - generic [ref=f3e103]:
          - article [ref=f3e104]:
            - generic [aria-hidden] [ref=f3e105]: 🎯
            - heading "Exacto al céntimo" [level=3] [ref=f3e106]
            - paragraph [ref=f3e107]: Los importes son siempre enteros en la unidad mínima de cada moneda, sin decimales “flotantes”. Los céntimos sobrantes se reparten por el método del mayor resto, así que la suma coincide exactamente con el total.
          - article [ref=f3e108]:
            - generic [aria-hidden] [ref=f3e109]: 🧮
            - heading "Reparto a tu medida" [level=3] [ref=f3e110]
            - paragraph [ref=f3e111]: Partes iguales, importes exactos, porcentajes o partes (2 para quien durmió dos noches). Varias personas pueden pagar el mismo gasto.
          - article [ref=f3e112]:
            - generic [aria-hidden] [ref=f3e113]: 💱
            - heading "Multimoneda" [level=3] [ref=f3e114]
            - paragraph [ref=f3e115]: Cada gasto en su moneda, con tipo de cambio sugerido. Los saldos se calculan con importes convertidos exactos.
          - article [ref=f3e116]:
            - generic [aria-hidden] [ref=f3e117]: 🔀
            - heading "Pagos mínimos" [level=3] [ref=f3e118]
            - paragraph [ref=f3e119]: En vez de cruzar deudas, Juntio propone las transferencias justas para dejar el saldo de todos a cero.
          - article [ref=f3e120]:
            - generic [aria-hidden] [ref=f3e121]: 🧾
            - heading "Tickets adjuntos" [level=3] [ref=f3e122]
            - paragraph [ref=f3e123]: Sube la foto o el PDF del ticket a cada gasto. Solo los miembros del grupo pueden verlo.
          - article [ref=f3e124]:
            - generic [aria-hidden] [ref=f3e125]: ⚡
            - heading "Tiempo real" [level=3] [ref=f3e126]
            - paragraph [ref=f3e127]: Cuando alguien añade un gasto, los demás lo ven al instante, sin recargar.
          - article [ref=f3e128]:
            - generic [aria-hidden] [ref=f3e129]: 📴
            - heading "Sin conexión" [level=3] [ref=f3e130]
            - paragraph [ref=f3e131]: "En móvil y escritorio, añade gastos y pagos sin red: se sincronizan solos al volver la conexión."
          - article [ref=f3e132]:
            - generic [aria-hidden] [ref=f3e133]: 📤
            - heading "Exporta a CSV y PDF" [level=3] [ref=f3e134]
            - paragraph [ref=f3e135]: Informe del grupo con gastos, pagos y saldos, listo para guardar o compartir.
          - article [ref=f3e136]:
            - generic [aria-hidden] [ref=f3e137]: 👥
            - heading "Roles y control" [level=3] [ref=f3e138]
            - paragraph [ref=f3e139]: Administradores y miembros, archivado de grupos y salida de miembros solo cuando su saldo está a cero.
          - article [ref=f3e140]:
            - generic [aria-hidden] [ref=f3e141]: ♿
            - heading "Accesible y en tu idioma" [level=3] [ref=f3e142]
            - paragraph [ref=f3e143]: Español, inglés, francés, gallego, catalán y euskera. Material 3, modo claro y oscuro, textos hasta un 300 % y áreas táctiles amplias.
          - article [ref=f3e144]:
            - generic [aria-hidden] [ref=f3e145]: 💻
            - heading "Donde la uses" [level=3] [ref=f3e146]
            - paragraph [ref=f3e147]: Navegador, Android, iOS, Windows, macOS y Linux. Una cuenta, los mismos grupos en todos tus dispositivos.
