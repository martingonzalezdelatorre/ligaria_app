    - region "Tu dinero y tus datos, explicados sin letra pequeña" [ref=f3e213]:
      - generic [ref=f3e214]:
        - generic [ref=f3e215]:
          - generic [ref=f3e216]: Confianza
          - heading "Tu dinero y tus datos, explicados sin letra pequeña" [level=2] [ref=f3e217]
          - paragraph [ref=f3e218]: Cuando hay dinero de por medio, la confianza se demuestra con cómo está construido. Esto es lo que hace Juntio, concretamente.
        - generic [ref=f3e219]:
          - article [ref=f3e220]:
            - generic [aria-hidden] [ref=f3e221]: 🧮
            - heading "Cálculo verificable" [level=3] [ref=f3e222]
            - paragraph [ref=f3e223]: Los repartos los calcula el servidor y la app los replica para validarlos y previsualizarlos. Hay pruebas automáticas que garantizan que la suma sea exactamente el total.
          - article [ref=f3e224]:
            - generic [aria-hidden] [ref=f3e225]: 🔐
            - heading "Sesión protegida" [level=3] [ref=f3e226]
            - paragraph [ref=f3e227]: Acceso con tokens de corta duración (15 minutos) y renovación segura. En el dispositivo, la sesión se guarda en el almacenamiento seguro del sistema, no en texto plano.
          - article [ref=f3e228]:
            - generic [aria-hidden] [ref=f3e229]: 🗑️
            - heading "Tu cuenta, tu decisión" [level=3] [ref=f3e230]
            - paragraph [ref=f3e231]: Puedes borrar tu cuenta desde la app. Se anonimiza tu usuario y se cierran tus sesiones; los gastos del grupo se conservan sin tu nombre para no descuadrar a los demás.
          - article [ref=f3e232]:
            - generic [aria-hidden] [ref=f3e233]: 📤
            - heading "Tus datos, siempre contigo" [level=3] [ref=f3e234]
            - paragraph [ref=f3e235]: Exporta cuando quieras gastos, pagos y saldos a CSV o PDF. El aviso en tiempo real a tu grupo no incluye datos personales.
