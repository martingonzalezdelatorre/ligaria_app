    - region "Your money and your data, explained without fine print" [ref=f6e213]:
      - generic [ref=f6e214]:
        - generic [ref=f6e215]:
          - generic [ref=f6e216]: Trust
          - heading "Your money and your data, explained without fine print" [level=2] [ref=f6e217]
          - paragraph [ref=f6e218]: When money is involved, trust is shown by how things are built. Here is what Juntio does, specifically.
        - generic [ref=f6e219]:
          - article [ref=f6e220]:
            - generic [aria-hidden] [ref=f6e221]: 🧮
            - heading "Verifiable maths" [level=3] [ref=f6e222]
            - paragraph [ref=f6e223]: The server calculates the splits and the app replicates them to validate and preview. Automated tests make sure the sum is exactly the total.
          - article [ref=f6e224]:
            - generic [aria-hidden] [ref=f6e225]: 🔐
            - heading "Protected sessions" [level=3] [ref=f6e226]
            - paragraph [ref=f6e227]: Short-lived access tokens (15 minutes) with secure renewal. On your device the session lives in the system’s secure storage, never in plain text.
          - article [ref=f6e228]:
            - generic [aria-hidden] [ref=f6e229]: 🗑️
            - heading "Your account, your call" [level=3] [ref=f6e230]
            - paragraph [ref=f6e231]: Delete your account from the app. Your user is anonymised and your sessions closed; group expenses stay without your name so nobody else’s balance is thrown off.
          - article [ref=f6e232]:
            - generic [aria-hidden] [ref=f6e233]: 📤
            - heading "Your data, always with you" [level=3] [ref=f6e234]
            - paragraph [ref=f6e235]: Export expenses, payments and balances to CSV or PDF whenever you want. The real-time notice to your group carries no personal data.
