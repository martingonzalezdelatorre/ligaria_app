    - region "Split group expenses in three steps" [ref=f6e81]:
      - generic [ref=f6e82]:
        - generic [ref=f6e83]:
          - generic [ref=f6e84]: How it works
          - heading "Split group expenses in three steps" [level=2] [ref=f6e85]
          - paragraph [ref=f6e86]: Built so nobody has to open a spreadsheet or chase friends for money.
        - list [ref=f6e87]:
          - listitem [ref=f6e88]:
            - heading "Create the group and invite" [level=3] [ref=f6e89]
            - paragraph [ref=f6e90]: Name it (“Flat 4B”, “Iceland roadtrip”), pick the currency and share the invitation link. Everyone joins with their own account.
          - listitem [ref=f6e91]:
            - heading "Add expenses on the spot" [level=3] [ref=f6e92]
            - paragraph [ref=f6e93]: "Say who paid and who shares it: equally, by amounts, percentages or shares. Attach a photo of the receipt if you like."
          - listitem [ref=f6e94]:
            - heading "Settle up with minimal payments" [level=3] [ref=f6e95]
            - paragraph [ref=f6e96]: Juntio works out the balances and suggests who pays whom to get everyone even with the fewest transfers. Record each payment and you are done.
    - region "Everything you need to keep the books clear" [ref=f6e97]:
      - generic [ref=f6e98]:
        - generic [ref=f6e99]:
          - generic [ref=f6e100]: Features
          - heading "Everything you need to keep the books clear" [level=2] [ref=f6e101]
          - paragraph [ref=f6e102]: One app, the same experience in the browser, on your phone and on your computer.
        - generic [ref=f6e103]:
          - article [ref=f6e104]:
            - generic [aria-hidden] [ref=f6e105]: 🎯
            - heading "Cent-exact" [level=3] [ref=f6e106]
            - paragraph [ref=f6e107]: Amounts are always integers in each currency’s smallest unit, never floating-point decimals. Leftover cents are shared with the largest remainder method, so the splits add up exactly to the total.
          - article [ref=f6e108]:
            - generic [aria-hidden] [ref=f6e109]: 🧮
            - heading "Splits your way" [level=3] [ref=f6e110]
            - paragraph [ref=f6e111]: Equal shares, exact amounts, percentages or shares (2 for whoever stayed two nights). Several people can pay the same expense.
          - article [ref=f6e112]:
            - generic [aria-hidden] [ref=f6e113]: 💱
            - heading "Multi-currency" [level=3] [ref=f6e114]
            - paragraph [ref=f6e115]: Each expense in its own currency, with a suggested exchange rate. Balances use exact converted amounts.
          - article [ref=f6e116]:
            - generic [aria-hidden] [ref=f6e117]: 🔀
            - heading "Minimal payments" [level=3] [ref=f6e118]
            - paragraph [ref=f6e119]: Instead of crossing debts, Juntio proposes just the transfers needed to bring everyone’s balance to zero.
          - article [ref=f6e120]:
            - generic [aria-hidden] [ref=f6e121]: 🧾
            - heading "Attached receipts" [level=3] [ref=f6e122]
            - paragraph [ref=f6e123]: Upload a photo or PDF of the receipt to each expense. Only group members can see it.
          - article [ref=f6e124]:
            - generic [aria-hidden] [ref=f6e125]: ⚡
            - heading "Real time" [level=3] [ref=f6e126]
            - paragraph [ref=f6e127]: When someone adds an expense, everyone else sees it instantly, no refresh needed.
          - article [ref=f6e128]:
            - generic [aria-hidden] [ref=f6e129]: 📴
            - heading "Offline" [level=3] [ref=f6e130]
            - paragraph [ref=f6e131]: "On mobile and desktop, add expenses and payments without a network: they sync on their own when you are back online."
          - article [ref=f6e132]:
            - generic [aria-hidden] [ref=f6e133]: 📤
            - heading "Export to CSV and PDF" [level=3] [ref=f6e134]
            - paragraph [ref=f6e135]: A group report with expenses, payments and balances, ready to save or share.
          - article [ref=f6e136]:
            - generic [aria-hidden] [ref=f6e137]: 👥
            - heading "Roles and control" [level=3] [ref=f6e138]
            - paragraph [ref=f6e139]: Admins and members, group archiving, and members can leave only when their balance is zero.
          - article [ref=f6e140]:
            - generic [aria-hidden] [ref=f6e141]: ♿
            - heading "Accessible and in your language" [level=3] [ref=f6e142]
            - paragraph [ref=f6e143]: Spanish, English, French, Galician, Catalan and Basque. Material 3, light and dark mode, text up to 300% and generous touch targets.
          - article [ref=f6e144]:
            - generic [aria-hidden] [ref=f6e145]: 💻
            - heading "Wherever you use it" [level=3] [ref=f6e146]
            - paragraph [ref=f6e147]: Browser, Android, iOS, Windows, macOS and Linux. One account, the same groups on all your devices.
