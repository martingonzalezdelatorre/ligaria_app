name: ligaria_friends
description: "Ligaria Friends: ligas entre amigos."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  ligaria_ui:
  ligaria_notificaciones:
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

# Icono de Ligaria Friends: logo LG + insignia violeta de "amigos".
# Regenerar con: dart run flutter_launcher_icons (desde apps/ligaria_friends)
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#08140C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#08140C"
    theme_color: "#8B5CF6"
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
